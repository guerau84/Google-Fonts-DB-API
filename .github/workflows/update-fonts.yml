name: Update Fonts

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Clone external repository
        run: |
          git clone --filter=blob:none https://github.com/google/fonts.git "$GITHUB_WORKSPACE/../google-fonts"
          echo "HEAD_HASH=$(git -C "$GITHUB_WORKSPACE/../google-fonts" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Read previous commit from state
        run: |
          OLD_COMMIT=$(node -p "require('./src/data/workflow-state.json').lastCommit || ''")
          echo "OLD_COMMIT=$OLD_COMMIT" >> "$GITHUB_ENV"

      - name: Save current commit hash to state
        run: |
          node -e "require('fs').writeFileSync('src/data/workflow-state.json', JSON.stringify({ lastCommit: process.env.HEAD_HASH }, null, 4))"

      - name: Detect relevant changes
        id: detect_changes
        run: |
          if [ -z "$OLD_COMMIT" ]; then
            echo "No previous state — full run"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            touch "$GITHUB_WORKSPACE/changed-files.txt"
            exit 0
          fi
          git -C "$GITHUB_WORKSPACE/../google-fonts" diff --name-only "$OLD_COMMIT" HEAD > "$GITHUB_WORKSPACE/changed-files.txt" || true
          echo "Changed files:"
          cat "$GITHUB_WORKSPACE/changed-files.txt"
          RELEVANT=$(grep -E '^(ofl|apache|ufl|catalog)/' "$GITHUB_WORKSPACE/changed-files.txt" || true)
          if [ -n "$RELEVANT" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update fonts
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: npx tsx src/scripts/update.ts

      - name: Commit and push changes
        uses: EndBug/add-and-commit@v9
        with:
          message: 'chore: update fonts'
          add: 'src/data public/fonts'